# JesterTrap WP - Honeypot WordPress en puerto 80 (v2)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/wp-honeypot;
    index index.php index.html;

    access_log /var/log/nginx/wp-honeypot-access.log;
    error_log /var/log/nginx/wp-honeypot-error.log;

    location /honeypot {
        return 404;
    }

    location = /wp-login.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /xmlrpc.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /wp-comments-post.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /wp-trackback.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /sitemap.xml {
        rewrite ^/sitemap\.xml$ /sitemap.xml.php break;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # wp-admin
    location /wp-admin/ {
        try_files $uri $uri/ /wp-admin/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # REST API WooCommerce - /wp-json/wc/v3/
    location /wp-json/wc/v3/ {
        try_files $uri $uri/ /wp-json/wc/v3/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # REST API v2 - rutas bajo /wp-json/wp/v2/ van al index.php de v2
    location /wp-json/wp/v2/ {
        try_files $uri $uri/ /wp-json/wp/v2/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # REST API root - /wp-json/ va al index.php raiz
    location /wp-json/ {
        try_files $uri $uri/ /wp-json/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # Shop
    location /shop/ {
        try_files $uri $uri/ /shop/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location /product/ {
        try_files $uri $uri/ /shop/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # Cebos
    location = /wp-config.php.bak { return 403; }
    location = /wp-config.php { return 404; }
    location ~ /\.git { return 404; }
    location = /.env { return 404; }
    location ~ \.(bak|backup|old|orig|save|swp|tmp)$ { return 403; }
    location = /adminer.php { return 404; }
    location = /phpinfo.php { return 404; }

    # wp-content
    location /wp-content/ {
        try_files $uri $uri/ /wp-content/plugins/index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # wp-includes
    location /wp-includes/ {
        try_files $uri =404;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location = /feed/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /readme.html { root /var/www/wp-honeypot; }
    location = /robots.txt { root /var/www/wp-honeypot; }

    # Main site
    location / {
        try_files $uri $uri/ /index.php?$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location ~ /\. { deny all; }
}
